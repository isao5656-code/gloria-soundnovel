<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080" preserveAspectRatio="xMidYMid slice">
<defs>

<filter id="soft6" x="-25%" y="-25%" width="150%" height="150%">
  <feGaussianBlur stdDeviation="6"/>
</filter>
<filter id="far" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="4"/>
</filter>
<filter id="bloom" x="-70%" y="-70%" width="240%" height="240%">
  <feGaussianBlur stdDeviation="22" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="grainf" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<filter id="cloud" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency="0.006 0.013" numOctaves="4" seed="3"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.5" intercept="-0.09"/></feComponentTransfer>
</filter>
<filter id="ripplef" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.004 0.055" numOctaves="3" seed="11"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.45" intercept="-0.07"/></feComponentTransfer>
</filter>
<filter id="woodf" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.55 0.014" numOctaves="3" seed="5"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.32" intercept="-0.05"/></feComponentTransfer>
</filter>
<linearGradient id="air" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b150f" stop-opacity="1"/><stop offset="0.5" stop-color="#2a2018" stop-opacity="1"/><stop offset="1" stop-color="#1a130d" stop-opacity="1"/></linearGradient>
   <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33261a" stop-opacity="1"/><stop offset="1" stop-color="#20180f" stop-opacity="1"/></linearGradient>
   <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241a11" stop-opacity="1"/><stop offset="1" stop-color="#120c07" stop-opacity="1"/></linearGradient>
   <radialGradient id="fire"><stop offset="0" stop-color="#ffcf86" stop-opacity="0.8"/><stop offset="0.3" stop-color="#e8933a" stop-opacity="0.36"/><stop offset="0.68" stop-color="#a55f22" stop-opacity="0.1"/><stop offset="1" stop-color="#a55f22" stop-opacity="0"/></radialGradient>
   <radialGradient id="firepool"><stop offset="0" stop-color="#f0ab54" stop-opacity="0.32"/><stop offset="1" stop-color="#f0ab54" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="1080" fill="url(#air)"/>
