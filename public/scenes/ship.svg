<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080" preserveAspectRatio="xMidYMid slice">
<defs>

<filter id="soft6" x="-25%" y="-25%" width="150%" height="150%">
  <feGaussianBlur stdDeviation="6"/>
</filter>
<filter id="far" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="4"/>
</filter>
<filter id="bloom" x="-70%" y="-70%" width="240%" height="240%">
  <feGaussianBlur stdDeviation="22" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="grainf" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<filter id="cloud" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency="0.006 0.013" numOctaves="4" seed="3"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.5" intercept="-0.09"/></feComponentTransfer>
</filter>
<filter id="ripplef" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.004 0.055" numOctaves="3" seed="11"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.45" intercept="-0.07"/></feComponentTransfer>
</filter>
<filter id="woodf" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.55 0.014" numOctaves="3" seed="5"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.32" intercept="-0.05"/></feComponentTransfer>
</filter>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1219" stop-opacity="1"/><stop offset="0.45" stop-color="#1a2431" stop-opacity="1"/><stop offset="1" stop-color="#2c3849" stop-opacity="1"/></linearGradient>
   <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26323f" stop-opacity="1"/><stop offset="0.4" stop-color="#161f29" stop-opacity="1"/><stop offset="1" stop-color="#080c11" stop-opacity="1"/></linearGradient>
   <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161f29" stop-opacity="1"/><stop offset="1" stop-color="#0a0e13" stop-opacity="1"/></linearGradient>
   <linearGradient id="sail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4854" stop-opacity="1"/><stop offset="1" stop-color="#242e38" stop-opacity="1"/></linearGradient>
   <radialGradient id="moon"><stop offset="0" stop-color="#dbe6f0" stop-opacity="0.42"/><stop offset="0.35" stop-color="#9db6cc" stop-opacity="0.13"/><stop offset="1" stop-color="#9db6cc" stop-opacity="0"/></radialGradient>
   <radialGradient id="wake"><stop offset="0" stop-color="#c3d6e6" stop-opacity="0.18"/><stop offset="1" stop-color="#c3d6e6" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="1080" fill="url(#sky)"/>
