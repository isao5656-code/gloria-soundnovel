  <line x1="486" y1="304" x2="714" y2="304" stroke="#3f4b55" stroke-width="7"/>
  <g stroke="#c3daea" stroke-width="1.6" opacity="0.32">
    <line x1="510" y1="214" x2="498" y2="394"/><line x1="542" y1="214" x2="530" y2="394"/><line x1="574" y1="214" x2="562" y2="394"/><line x1="606" y1="214" x2="594" y2="394"/><line x1="638" y1="214" x2="626" y2="394"/><line x1="670" y1="214" x2="658" y2="394"/>
