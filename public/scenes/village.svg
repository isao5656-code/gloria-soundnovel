<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080" preserveAspectRatio="xMidYMid slice">
<defs>

<filter id="soft6" x="-25%" y="-25%" width="150%" height="150%">
  <feGaussianBlur stdDeviation="6"/>
</filter>
<filter id="far" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="4"/>
</filter>
<filter id="bloom" x="-70%" y="-70%" width="240%" height="240%">
  <feGaussianBlur stdDeviation="22" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="grainf" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<filter id="cloud" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency="0.006 0.013" numOctaves="4" seed="3"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.5" intercept="-0.09"/></feComponentTransfer>
</filter>
<filter id="ripplef" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.004 0.055" numOctaves="3" seed="11"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.45" intercept="-0.07"/></feComponentTransfer>
</filter>
<filter id="woodf" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.55 0.014" numOctaves="3" seed="5"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.32" intercept="-0.05"/></feComponentTransfer>
</filter>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202b39" stop-opacity="1"/><stop offset="0.5" stop-color="#33445a" stop-opacity="1"/><stop offset="1" stop-color="#4d5f74" stop-opacity="1"/></linearGradient>
   <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c242e" stop-opacity="1"/><stop offset="1" stop-color="#10161d" stop-opacity="1"/></linearGradient>
   <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232b34" stop-opacity="1"/><stop offset="1" stop-color="#12181e" stop-opacity="1"/></linearGradient>
   <radialGradient id="warm"><stop offset="0" stop-color="#f2cd8a" stop-opacity="0.58"/><stop offset="0.4" stop-color="#c99a4e" stop-opacity="0.2"/><stop offset="1" stop-color="#c99a4e" stop-opacity="0"/></radialGradient>
   <radialGradient id="street"><stop offset="0" stop-color="#ffdda0" stop-opacity="0.5"/><stop offset="0.3" stop-color="#d9a75c" stop-opacity="0.2"/><stop offset="1" stop-color="#d9a75c" stop-opacity="0"/></radialGradient>
   <radialGradient id="roadpool"><stop offset="0" stop-color="#e8bf7d" stop-opacity="0.22"/><stop offset="1" stop-color="#e8bf7d" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="1080" fill="url(#sky)"/>
