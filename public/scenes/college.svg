<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080" preserveAspectRatio="xMidYMid slice">
<defs>

<filter id="soft6" x="-25%" y="-25%" width="150%" height="150%">
  <feGaussianBlur stdDeviation="6"/>
</filter>
<filter id="far" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="4"/>
</filter>
<filter id="bloom" x="-70%" y="-70%" width="240%" height="240%">
  <feGaussianBlur stdDeviation="22" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="grainf" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<filter id="cloud" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency="0.006 0.013" numOctaves="4" seed="3"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.5" intercept="-0.09"/></feComponentTransfer>
</filter>
<filter id="ripplef" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.004 0.055" numOctaves="3" seed="11"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.45" intercept="-0.07"/></feComponentTransfer>
</filter>
<filter id="woodf" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.55 0.014" numOctaves="3" seed="5"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.32" intercept="-0.05"/></feComponentTransfer>
</filter>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141d29" stop-opacity="1"/><stop offset="0.55" stop-color="#1e2b3a" stop-opacity="1"/><stop offset="1" stop-color="#2b3948" stop-opacity="1"/></linearGradient>
   <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232c36" stop-opacity="1"/><stop offset="1" stop-color="#161d25" stop-opacity="1"/></linearGradient>
   <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b232c" stop-opacity="1"/><stop offset="1" stop-color="#0d1319" stop-opacity="1"/></linearGradient>
   <radialGradient id="warm"><stop offset="0" stop-color="#f0c479" stop-opacity="0.55"/><stop offset="0.45" stop-color="#c99a4e" stop-opacity="0.2"/><stop offset="1" stop-color="#c99a4e" stop-opacity="0"/></radialGradient>
   <radialGradient id="floorlight"><stop offset="0" stop-color="#e8bf7d" stop-opacity="0.3"/><stop offset="1" stop-color="#e8bf7d" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="1080" fill="url(#sky)"/>
<rect x="0" y="0" width="1200" height="460" fill="#6a8098" filter="url(#cloud)" opacity="0.16"/>
<g filter="url(#far)" opacity="0.5">
  <rect x="60" y="250" width="1080" height="420" fill="#2a3644"/>
  <path d="M40 250 L600 150 L1160 250 z" fill="#2f3c4b"/>
</g>
<rect x="90" y="300" width="1020" height="470" fill="url(#stone)"/>
<g fill="#0e141b">
  <path d="M205 770 v-250 a86 86 0 0 1 172 0 v250 z"/><path d="M435 770 v-250 a86 86 0 0 1 172 0 v250 z"/><path d="M665 770 v-250 a86 86 0 0 1 172 0 v250 z"/><path d="M895 770 v-250 a86 86 0 0 1 172 0 v250 z"/>
</g>
<g fill="none" stroke="#39485a" stroke-width="4">
  <path d="M205 770 v-250 a86 86 0 0 1 172 0 v250"/><path d="M435 770 v-250 a86 86 0 0 1 172 0 v250"/><path d="M665 770 v-250 a86 86 0 0 1 172 0 v250"/><path d="M895 770 v-250 a86 86 0 0 1 172 0 v250"/>
</g>
<g fill="#4a5b6e" opacity="0.5">
  <rect x="196" y="480" width="5" height="290"/><rect x="426" y="480" width="5" height="290"/><rect x="656" y="480" width="5" height="290"/><rect x="886" y="480" width="5" height="290"/><rect x="1116" y="480" width="5" height="290"/>
</g>
<g>
  <circle cx="494" cy="536" r="330" fill="url(#warm)"/>
  <rect x="455" y="470" width="78" height="132" rx="2" fill="#f2cd8a" filter="url(#bloom)" opacity="0.9"/>
  <line x1="494" y1="470" x2="494" y2="602" stroke="#0d1013" stroke-width="3.9000000000000004"/>
  <line x1="455" y1="525.44" x2="533" y2="525.44" stroke="#0d1013" stroke-width="3.9000000000000004"/>
</g>
<g>
  <circle cx="724" cy="536" r="330" fill="url(#warm)"/>
  <rect x="685" y="470" width="78" height="132" rx="2" fill="#f2cd8a" filter="url(#bloom)" opacity="0.9"/>
  <line x1="724" y1="470" x2="724" y2="602" stroke="#0d1013" stroke-width="3.9000000000000004"/>
  <line x1="685" y1="525.44" x2="763" y2="525.44" stroke="#0d1013" stroke-width="3.9000000000000004"/>
</g>
<rect x="90" y="294" width="1020" height="12" fill="#3c4a5b"/>
<rect x="0" y="770" width="1200" height="310" fill="url(#ground)"/>
<ellipse cx="494" cy="836" rx="140" ry="46" fill="url(#floorlight)" opacity="1"/>
<ellipse cx="724" cy="836" rx="120" ry="40" fill="url(#floorlight)" opacity="1"/>
<g stroke="#26313d" stroke-width="2" opacity="0.45">
  <line x1="0" y1="800" x2="1200" y2="800"/><line x1="0" y1="858" x2="1200" y2="858"/><line x1="0" y1="916" x2="1200" y2="916"/><line x1="0" y1="974" x2="1200" y2="974"/><line x1="0" y1="1032" x2="1200" y2="1032"/>
  <line x1="0" y1="770" x2="-60" y2="1080"/><line x1="180" y1="770" x2="120" y2="1080"/><line x1="360" y1="770" x2="300" y2="1080"/><line x1="540" y1="770" x2="480" y2="1080"/><line x1="720" y1="770" x2="660" y2="1080"/><line x1="900" y1="770" x2="840" y2="1080"/><line x1="1080" y1="770" x2="1020" y2="1080"/>
</g>
<rect x="0" y="770" width="1200" height="310" fill="#7d94ad" filter="url(#ripplef)" opacity="0.1"/>
<rect width="1200" height="1080" filter="url(#grainf)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
